name: publish
run-name: build apps and publish apps.openbeak.net

# Builds the apps whose recipes (apps/<id>/) have changed since they were published, checks them, and publishes them to apps.openbeak.net's testing suite, where test units take them (OF-BOOT/settings/test.txt); "ok" on the testing issue releases them to every OpenFrame (promote.yml). The repository is the repo branch (GitHub Pages, served at apps.openbeak.net): two suites, trixie and trixie-testing, signed with the OpenFrame Apps key, which nothing else uses. openframe-scripts sets units up to trust it for ofapp-* packages only (its pin), and to take their updates overnight.
#
# There are two jobs, so a recipe's own code never runs where the signing key is. build, with no secrets and the repository read-only, builds, checks and tests each app in throwaway containers (ci/build-apps.sh), and publish takes only the packages it made, and signs.

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'ci/**'
      - 'tests/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

concurrency:
  group: build-package
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      built: ${{ steps.build.outputs.built }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0    # versions count this month's commits (ci/app-version.sh)
          persist-credentials: false

      # what's published already (none of it is built again)
      - name: Checkout repo branch
        uses: actions/checkout@v7
        with:
          ref: repo
          path: apt-repo
          persist-credentials: false

      # ci/check-app.sh, tested before it's trusted with a recipe's package.
      - name: Test the package checks
        run: bash tests/test_check_app.sh

      - name: Build, check and test the apps
        id: build
        run: |
          bash ci/build-apps.sh out
          if [ -s out/built.txt ]; then echo "built=yes" >> "$GITHUB_OUTPUT"; else echo "built=no" >> "$GITHUB_OUTPUT"; fi
          # only what built.txt lists goes on to publish: each app's checked package, and its source
          mkdir pub
          cp out/built.txt pub/
          while read -r id deb; do
            mkdir -p "pub/$id"
            cp -- "out/$deb" "pub/$deb"
            if [ -d "out/$id/source-ofapp-$id" ]; then cp -r -- "out/$id/source-ofapp-$id" "pub/$id/"; fi
          done < out/built.txt

      - name: Keep the packages for publishing
        if: steps.build.outputs.built == 'yes'
        uses: actions/upload-artifact@v7
        with:
          name: apps
          path: pub/
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write   # the testing issue (ci/testing-issue.sh)
      actions: read   # whether this put aside an ok waiting to promote

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install tools
        run: sudo apt-get install -y apt-utils dpkg-dev

      - name: Ensure repo branch exists
        run: |
          git fetch origin repo:refs/remotes/origin/repo 2>/dev/null || {
            git checkout --orphan repo-init && git rm -rfq . &&
            echo apps.openbeak.net > CNAME && git add CNAME &&
            git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -qm "apt repository" && git push origin repo-init:repo && git checkout -q "${GITHUB_SHA}"; }

      - name: Checkout repo branch
        uses: actions/checkout@v7
        with:
          ref: repo
          path: apt-repo

      - name: Fetch the packages
        if: needs.build.outputs.built == 'yes'
        uses: actions/download-artifact@v7
        with:
          name: apps
          path: out

      # The apps are signed with a key of their own (OpenFrame Apps), never the system repositories' one, and anything else stops here.
      - name: Import GPG signing key
        env:
          KEY: ${{ secrets.APT_SIGNING_KEY_OPENFRAME_APPS }}
        run: |
          echo "${KEY}" | gpg --batch --import
          FPR=$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^sec/ { s = 1; next } s && /^fpr/ { print $10; s = 0 }')
          [ "${FPR}" = B17CE4B9D4666458FFFBAD99C0A0A443333DC2F6 ] || { echo "Signing key ${FPR} is not the OpenFrame Apps key"; exit 1; }
          echo "GPG_KEY_ID=${FPR}" >> $GITHUB_ENV
          # the public half in the repository is the same key
          gpg --show-keys --with-colons ci/openframe-apps.gpg | grep -q "^fpr:::::::::${FPR}:" ||
            { echo "ci/openframe-apps.gpg isn't the signing key's public half"; exit 1; }

      # ci/apt-suite.sh, tested before it's used.
      - name: Test the testing and released suites
        run: bash tests/test_apt_suite.sh

      - name: Update apt repository
        env:
          APT_NAME: OpenFrame Apps
          APT_ORIGIN: OpenFrame Apps
        run: |
          export SIGN_ARGS="--local-user ${GPG_KEY_ID}!"
          if [ -s out/built.txt ]; then
            # only what's listed, the packages the build job made and checked, each ofapp-<id> in <id>/, a line each
            debs=()
            while read -r id deb; do
              [[ "$id" =~ ^[a-z0-9][a-z0-9-]{0,39}$ && "$deb" =~ ^$id/ofapp-${id}_[A-Za-z0-9.+~-]+_(i386|all)\.deb$ ]] || { echo "built.txt: an odd line, $id $deb"; exit 1; }
              [ "$(dpkg-deb -f "out/$deb" Package)" = "ofapp-$id" ] || { echo "$deb isn't ofapp-$id"; exit 1; }
              debs+=("out/$deb")
            done < out/built.txt
            bash ci/apt-suite.sh add trixie-testing "${debs[@]}"
            bash ci/sources.sh add out
          else
            bash ci/apt-suite.sh index trixie-testing
          fi
          bash ci/apt-suite.sh index trixie
          gpg --export "${GPG_KEY_ID}" > apt-repo/key.gpg
          echo apps.openbeak.net > apt-repo/CNAME
          bash ci/apt-suite.sh listing

      - name: Push apt repository
        run: |
          cd apt-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes to commit" || \
            git commit -m "apt: publish to testing ($(git -C .. rev-parse --short HEAD))"
          git push origin repo

      - name: Update the testing issue
        if: needs.build.outputs.built == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          ASSIGNEE: ${{ vars.TESTING_ASSIGNEE || 'andydvsn' }}   # who's told (an organisation can't be)
        run: |
          list=$(while read -r id deb; do echo "$(dpkg-deb -f "out/$deb" Package) $(dpkg-deb -f "out/$deb" Version)"; done < out/built.txt |
            paste -sd, - | sed 's/,/, /g')
          # and, for an app from upstream's releases, what changed upstream since the release OpenFrames have (shop.txt's changes=)
          links=$(while read -r id deb; do
            new=$(sed -n 's/^version=//p' "apps/$id/shop.txt" | tail -1 | tr -d '[:space:]')
            url=$(sed -n 's/^changes=//p' "apps/$id/shop.txt" | tail -1 | tr -d '[:space:]')
            rel=$(ls apt-repo/pool/trixie/ofapp-"${id}"_*.deb 2>/dev/null | head -1)
            [ -n "$new" ] && [ -n "$url" ] && [ -n "$rel" ] || continue
            old=${rel##*/}; old=${old#ofapp-"${id}"_}; old=${old%_*}; old=${old%-*}
            [ "$old" != "$new" ] || continue
            [[ "$url" =~ ^https://[^[:space:]]+$ ]] || continue
            echo "What changed in $(sed -n 's/^name=//p' "apps/$id/app.txt" | tail -1) from $old to $new: $(sed "s/{old}/$old/g; s/{new}/$new/g" <<< "$url")"
          done < out/built.txt)
          bash ci/testing-issue.sh "In testing: ${list} (${GITHUB_SHA::7}).${links:+$'\n\n'${links}}"

      # GitHub keeps one run waiting in a concurrency group, and cancels the one already waiting there: an ok that was waiting behind a build when this one arrived was cancelled, so the issue says so.
      - name: Say if an ok was displaced
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          t=$(date -u -d "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" -q .created_at)" +%s)
          since=$(date -u -d "@$((t - 120))" +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh run list -R "${GITHUB_REPOSITORY}" --workflow promote.yml --event issue_comment --status cancelled -L 20 --json updatedAt -q "[.[] | select(.updatedAt >= \"${since}\")] | length")
          num=$(gh issue list -R "${GITHUB_REPOSITORY}" --label testing --state open --json number -q '.[0].number')
          if [ "${n:-0}" -gt 0 ] && [ -n "$num" ]; then
            gh issue comment "$num" -R "${GITHUB_REPOSITORY}" --body "A reply here was put aside by this build, as GitHub keeps only one run waiting at a time. If it was ok or no, reply again." >/dev/null
          fi
